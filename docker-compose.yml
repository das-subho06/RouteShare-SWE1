services:

  backend:
    build: ./server
    ports:
      - "5000:5000"
    env_file:
      - .env
    depends_on:
      - postgres
      - redis

  frontend:
    build: ./client
    ports:
      - "5173:5173"
    depends_on:
      - backend

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: routeshare
      POSTGRES_PASSWORD: routeshare_password
      POSTGRES_DB: routeshare
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8
    ports:
      - "6379:6379"

volumes:
  postgres_data: